name: Review Town V12
on:
  push:
    branches: [feat/checkpoint-12-seats-groups, feat/v12-seat-fixes-20261108]
    paths: ['src/**','tests/**','tools/**','package*.json','index.html','.github/workflows/v12-review.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: town-v12-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install renderer and validate source
        run: |
          npm ci --ignore-scripts
          npm run vendor
          for file in src/*.js tools/*.mjs; do node --check "$file"; done
          npm test
      - name: Install capture browser
        run: npx playwright install --with-deps chromium
      - name: Verify actual seating, groups and phone layout
        run: node tools/review-v12.mjs
      - name: Preserve passing captures in Git
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/v12-captures
          cp artifacts-v12/* docs/v12-captures/
          git add docs/v12-captures
          if ! git diff --cached --quiet; then
            git commit -m 'docs(v12): preserve real seat and group-social captures'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Package recoverable checkpoint
        if: always()
        run: |
          mkdir -p town-v12-checkpoint
          git archive HEAD | tar -x -C town-v12-checkpoint
          if [ -d vendor ]; then cp -R vendor town-v12-checkpoint/; fi
          if [ -d artifacts-v12 ]; then cp -R artifacts-v12 town-v12-checkpoint/; fi
          git rev-parse HEAD > town-v12-checkpoint/COMMIT.txt
          cd town-v12-checkpoint
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: town-v12-checkpoint
          path: town-v12-checkpoint/
          include-hidden-files: true
          retention-days: 30
