name: Deploy Town to Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'style.css'
      - 'package*.json'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: town-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies and bundle the renderer
        run: |
          npm ci --ignore-scripts
          npm run vendor
      - name: Check source and generation tests
        run: |
          for file in src/*.js tools/*.mjs; do node --check "$file"; done
          npm test
      - name: Stage the public game with a deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html style.css _site/
          cp -R src vendor _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          touch _site/.nojekyll
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const files = {};
          async function scan(dir = '') {
            for (const entry of await readdir(`_site/${dir}`, { withFileTypes: true })) {
              const relative = `${dir}${entry.name}`;
              if (entry.isDirectory()) await scan(`${relative}/`);
              else if (entry.isFile()) files[relative] = createHash('sha256').update(await readFile(`_site/${relative}`)).digest('hex');
              else throw new Error(`Unsupported publish entry: ${relative}`);
            }
          }
          await scan();
          for (const file of ['index.html', 'style.css', 'src/main.js', 'src/main-v11.js', 'src/v11-hud.js', 'src/v11-life.js', 'src/v11-navigation.js', 'src/v12-seats.js', 'src/v10-characters.js', 'src/v10-fixtures.js', 'vendor/three.module.js', 'vendor/three.core.js', 'vendor/THREE-LICENSE.txt']) assert.ok(files[file], `Missing runtime file: ${file}`);
          await writeFile('_site/__deployment.json', JSON.stringify({ commit: process.env.GITHUB_SHA, files }, null, 2));
          console.log(`Prepared ${Object.keys(files).length} public files with same-origin renderer imports.`);
          NODE
      - name: Publish built files to the configured source branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          publish_dir="$RUNNER_TEMP/town-public"
          git worktree add --detach "$publish_dir" FETCH_HEAD
          rsync -a --delete --exclude='.git' _site/ "$publish_dir/"
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish_dir" add --all
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "deploy: Town from $GITHUB_SHA"
            git -C "$publish_dir" push origin HEAD:gh-pages
          fi
          echo "commit=$(git -C "$publish_dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Request the native Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify the published commit and every runtime file
        env:
          SITE_URL: https://jinjinjenn.github.io/town/
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { setTimeout as sleep } from 'node:timers/promises';
          const base = new URL(process.env.SITE_URL);
          async function get(file) {
            const url = new URL(file, base);
            url.searchParams.set('deployment', process.env.EXPECTED_COMMIT);
            const response = await fetch(url, { signal: AbortSignal.timeout(15000), cache: 'no-store' });
            assert.equal(response.status, 200, `${url.pathname}: HTTP ${response.status}`);
            return Buffer.from(await response.arrayBuffer());
          }
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const manifest = JSON.parse((await get('__deployment.json')).toString());
              assert.equal(manifest.commit, process.env.EXPECTED_COMMIT, 'The public site is serving an older deployment.');
              for (const [file, hash] of Object.entries(manifest.files)) {
                const bytes = await get(file);
                assert.equal(createHash('sha256').update(bytes).digest('hex'), hash, `Published file differs from build: ${file}`);
              }
              await mkdir('artifacts', { recursive: true });
              await writeFile('artifacts/live-files.json', JSON.stringify({ url: base.href, commit: manifest.commit, verifiedFiles: Object.keys(manifest.files), verifiedAt: new Date().toISOString() }, null, 2));
              console.log(`Verified ${base.href} at ${manifest.commit}: all ${Object.keys(manifest.files).length} published files match the build.`);
              break;
            } catch (error) {
              if (attempt === 29) throw error;
              console.log(`Waiting for the public deployment: ${error.message}`);
              await sleep(5000);
            }
          }
          NODE
      - name: Install the live verification browser
        run: npx playwright install --with-deps chromium
      - name: Verify V12 seating and multi-Sim socials on the public website
        env:
          SITE_URL: https://jinjinjenn.github.io/town/
        run: node tools/review-v12.mjs
      - name: Retain public deployment verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: town-live-verification
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
