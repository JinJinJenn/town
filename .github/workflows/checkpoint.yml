name: Validate and package Town

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'index.html'
      - 'style.css'
      - 'package*.json'
      - 'playwright.config.mjs'
      - '.github/workflows/checkpoint.yml'
      - 'CHECKPOINT.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: town-checkpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts
      - name: Prepare the offline renderer
        run: npm run vendor
      - name: Check JavaScript and deterministic generation
        run: |
          for file in src/*.js tools/*.mjs; do node --check "$file"; done
          npm test
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Verify rendering, controls, and mobile layout
        run: npm run test:browser
      - name: Package source and test evidence even when a check fails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p town-checkpoint
          git archive HEAD | tar -x -C town-checkpoint
          if [ -d vendor ]; then cp -r vendor town-checkpoint/; fi
          if [ -d artifacts ]; then cp -r artifacts town-checkpoint/; fi
          if [ -d test-results ]; then cp -r test-results town-checkpoint/; fi
          if [ -f package-lock.json ]; then cp package-lock.json town-checkpoint/; fi
          printf '%s\n' "$GITHUB_SHA" > town-checkpoint/COMMIT.txt
          cd town-checkpoint
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: town-checkpoint
          path: town-checkpoint/
          include-hidden-files: true
          retention-days: 30
