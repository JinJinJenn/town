name: Validate and package Town
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'tools/**', 'assets/**', 'index.html', 'package*.json', '.github/workflows/checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: town-checkpoint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies and renderer
        run: |
          npm ci --ignore-scripts
          npm run vendor
      - name: Check source and simulation tests
        run: |
          for file in src/*.js tools/*.mjs; do node --check "$file"; done
          npm test
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Verify V12 seats, groups and phone layout
        run: node tools/review-v12.mjs
      - name: Package source and evidence even when a check fails
        if: always()
        run: |
          mkdir -p town-checkpoint
          git archive HEAD | tar -x -C town-checkpoint
          if [ -d vendor ]; then cp -R vendor town-checkpoint/; fi
          if [ -d artifacts-v12 ]; then cp -R artifacts-v12 town-checkpoint/; fi
          printf '%s\n' "$GITHUB_SHA" > town-checkpoint/COMMIT.txt
          cd town-checkpoint
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: town-checkpoint
          path: town-checkpoint/
          include-hidden-files: true
          retention-days: 30
