name: Review Town V9
on:
  push:
    branches: [feat/checkpoint-09-gpu-live-mode]
    paths: ['src/**', 'tests/**', 'tools/**', 'index.html', '.github/workflows/v9-review.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: town-v9-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and save source before browser work
        run: |
          node tools/integrate-v9.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/world.js src/v9-hud.js src/v9-life.js src/main.js index.html package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(v9): activate GPU live mode and connected resident gatherings'
            git push origin HEAD:feat/checkpoint-09-gpu-live-mode
          fi
      - name: Validate code and resident navigation
        run: |
          npm ci --ignore-scripts
          npm run vendor
          for file in src/*.js tools/*.mjs; do node --check "$file"; done
          npm test
      - name: Install review browser
        run: npx playwright install --with-deps chromium
      - name: Check actual GPU interface, gatherings and phone controls
        run: node tools/review-v9.mjs
      - name: Preserve passing captures in Git
        run: |
          mkdir -p docs/v9-captures
          cp artifacts-v9/* docs/v9-captures/
          git add docs/v9-captures
          if ! git diff --cached --quiet; then
            git commit -m 'docs(v9): preserve GPU live-mode screenshots and measured counters'
            git push origin HEAD:feat/checkpoint-09-gpu-live-mode
          fi
      - name: Package source even on failure
        if: always()
        run: |
          mkdir -p town-v9-checkpoint
          git archive HEAD | tar -x -C town-v9-checkpoint
          if [ -d vendor ]; then cp -R vendor town-v9-checkpoint/; fi
          if [ -d artifacts-v9 ]; then cp -R artifacts-v9 town-v9-checkpoint/; fi
          git rev-parse HEAD > town-v9-checkpoint/COMMIT.txt
          cd town-v9-checkpoint
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: town-v9-checkpoint
          path: town-v9-checkpoint/
          include-hidden-files: true
          retention-days: 30
