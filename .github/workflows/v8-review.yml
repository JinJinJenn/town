name: Review Town V8
on:
  push:
    branches: [feat/checkpoint-08-prop-variety]
    paths: ['src/**', 'tests/**', 'tools/**', 'index.html', '.github/workflows/v8-review.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: town-v8-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASELINE_ROOT: /tmp/town-v7-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and checkpoint V8 before browser work
        run: |
          node tools/integrate-v8.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/home.js index.html package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(v8): activate shared prop catalogue in the playable town'
            git push origin HEAD:feat/checkpoint-08-prop-variety
          fi
          echo "TESTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate source and prepare the exact V7 baseline
        run: |
          npm ci --ignore-scripts
          npm run vendor
          for file in src/*.js tools/*.mjs; do node --check "$file"; done
          npm test
          git fetch origin 62d900bb3ec21c0487ed74f9bf98feb10c4b078e --depth=1
          mkdir -p "$BASELINE_ROOT"
          git archive 62d900bb3ec21c0487ed74f9bf98feb10c4b078e | tar -x -C "$BASELINE_ROOT"
          cp -R vendor "$BASELINE_ROOT/"
      - name: Install capture browser
        run: npx playwright install --with-deps chromium
      - name: Capture and test V8 against V7
        run: node tools/review-v8.mjs
      - name: Commit passing screenshots and measured counters
        run: |
          mkdir -p docs/v8-captures
          cp artifacts-v8/*.png artifacts-v8/comparison.json docs/v8-captures/
          git add docs/v8-captures
          if ! git diff --cached --quiet; then
            git commit -m 'docs(v8): preserve before-after screenshots and rendering measurements'
            git push origin HEAD:feat/checkpoint-08-prop-variety
          fi
      - name: Package recoverable source and evidence
        if: always()
        run: |
          mkdir -p town-v8-checkpoint
          git archive HEAD | tar -x -C town-v8-checkpoint
          if [ -d vendor ]; then cp -R vendor town-v8-checkpoint/; fi
          if [ -d artifacts-v8 ]; then cp -R artifacts-v8 town-v8-checkpoint/; fi
          git rev-parse HEAD > town-v8-checkpoint/COMMIT.txt
          cd town-v8-checkpoint
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: town-v8-checkpoint
          path: town-v8-checkpoint/
          include-hidden-files: true
          retention-days: 30
