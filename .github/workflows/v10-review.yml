name: Review Town V10
on:
  push:
    branches: [feat/checkpoint-10-household-life]
    paths: ['src/**', 'tests/**', 'tools/**', '.github/workflows/v10-review.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: town-v10-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and save V10 before browser work
        run: |
          node tools/integrate-v10.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src index.html package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(v10): activate household actions, portraits and refined residents'
            git push origin HEAD:feat/checkpoint-10-household-life
          fi
      - name: Validate source and household simulation
        run: |
          npm ci --ignore-scripts
          npm run vendor
          for file in src/*.js tools/*.mjs; do node --check "$file"; done
          npm test
      - name: Install capture browser
        run: npx playwright install --with-deps chromium
      - name: Test real household interactions and GPU controls
        run: node tools/review-v10.mjs
      - name: Preserve passing captures in Git
        run: |
          mkdir -p docs/v10-captures
          cp artifacts-v10/*.png artifacts-v10/review.json docs/v10-captures/
          git add docs/v10-captures
          if ! git diff --cached --quiet; then
            git commit -m 'docs(v10): save real household captures and regression evidence'
            git push origin HEAD:feat/checkpoint-10-household-life
          fi
      - name: Package recoverable source and evidence
        if: always()
        run: |
          mkdir -p town-v10-checkpoint
          git archive HEAD | tar -x -C town-v10-checkpoint
          if [ -d vendor ]; then cp -R vendor town-v10-checkpoint/; fi
          if [ -d artifacts-v10 ]; then cp -R artifacts-v10 town-v10-checkpoint/; fi
          git rev-parse HEAD > town-v10-checkpoint/COMMIT.txt
          cd town-v10-checkpoint
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: town-v10-checkpoint
          path: town-v10-checkpoint/
          include-hidden-files: true
          retention-days: 30
