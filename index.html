<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7dce7"><meta name="description" content="JinJinJenn Town: a cozy neighborhood in live mode."><title>Town V9 · JinJinJenn</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7dce7}#scene{display:block;width:100%;height:100%;touch-action:none;outline:none}#error{position:fixed;inset:20%;padding:24px;background:#fff1f6;color:#482238;font:18px system-ui}#error[hidden]{display:none}</style></head><body><canvas id="scene" tabindex="0" aria-label="Town live mode. Drag to pan, pinch or scroll to zoom, right drag or Q and E to rotate. Space pauses. 1, 2, and 3 change speed. H returns home. G gathers neighbors. F follows the selected resident. X uses the sofa. Tab and Enter operate the GPU controls. Escape opens options."></canvas><div id="error" hidden role="alert"></div><noscript>Town needs JavaScript and WebGL2.</noscript><script type="module">import('./src/main.js').then(({start})=>start()).catch(error=>{const box=document.getElementById('error');box.hidden=false;box.textContent='Town could not start: '+(error.message||error);console.error(error);});</script></body></html>
